{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Nuevo Pedido</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Fecha
                    </label>

                    <input type="date"
                           name="fecha"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Monto
                    </label>

                    <input type="number"
                           step="0.01"
                           name="monto"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Cliente
                    </label>

                    <select name="cliente_id"
                            class="form-control">

                        {% for cliente in clientes %}

                        <option value="{{ cliente.id }}">
                            {{ cliente.nombre }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Producto
                    </label>

                    <select name="producto_id"
                            class="form-control">

                        {% for producto in productos %}

                        <option value="{{ producto.id }}">
                            {{ producto.nombre }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>

                <a href="/pedidos/"
                   class="btn btn-secondary">

                   Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
