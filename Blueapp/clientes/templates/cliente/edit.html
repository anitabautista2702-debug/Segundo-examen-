{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Editar Cliente</h2>

    <form method="POST">

        <div class="mb-3">

            <label>Nombre</label>

            <input type="text"
                   name="nombre"
                   class="form-control"
                   value="{{ cliente.nombre }}">

        </div>

        <div class="mb-3">

            <label>Telefono</label>

            <input type="text"
                   name="telefono"
                   class="form-control"
                   value="{{ cliente.telefono }}">

        </div>

        <button class="btn btn-dark">
            Actualizar
        </button>

    </form>

</div>

{% endblock %}
