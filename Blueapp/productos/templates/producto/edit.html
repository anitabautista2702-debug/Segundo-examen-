{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Editar Producto</h2>

    <form method="POST">

        <div class="mb-3">

            <label>Nombre</label>

            <input type="text"
                   name="nombre"
                   class="form-control"
                   value="{{ producto.nombre }}">

        </div>

        <div class="mb-3">

            <label>Precio</label>

            <input type="number"
                   step="0.01"
                   name="precio"
                   class="form-control"
                   value="{{ producto.precio }}">

        </div>

        <div class="mb-3">

            <label>Stock</label>

            <input type="number"
                   name="stock"
                   class="form-control"
                   value="{{ producto.stock }}">

        </div>

        <button class="btn btn-dark">
            Actualizar
        </button>

    </form>

</div>

{% endblock %}
